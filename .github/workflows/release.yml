name: Cross-platform development release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torben-development-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            cli: target/release/torben.exe
            bundle: target/x86_64-pc-windows-msvc/release/bundle
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            cli: target/release/torben.exe
            bundle: target/aarch64-pc-windows-msvc/release/bundle
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            cli: target/release/torben
            bundle: target/x86_64-apple-darwin/release/bundle
          - runner: macos-15
            target: aarch64-apple-darwin
            cli: target/release/torben
            bundle: target/aarch64-apple-darwin/release/bundle
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cli: target/release/torben
            bundle: target/x86_64-unknown-linux-gnu/release/bundle
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cli: target/release/torben
            bundle: target/aarch64-unknown-linux-gnu/release/bundle
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component clippy,rustfmt --target ${{ matrix.target }}

      - name: Select pinned Rust toolchain
        run: rustup default 1.98.0

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          libssl-dev libgtk-3-dev patchelf

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tooling
        run: pnpm run test:release

      - name: Build locked CLI
        run: cargo build -p torben-cli --release --locked

      - name: Prepare native sidecars
        run: pnpm --filter @torben-app/desktop run prepare:bundled-tools:release

      - name: Build locked desktop packages
        run: >-
          pnpm --filter @torben-app/desktop exec tauri build
          --ci --target ${{ matrix.target }}
          --config src-tauri/tauri.bundle.conf.json
          -- --locked

      - name: Verify CLI version
        shell: node {0}
        env:
          TORBEN_CLI: ${{ matrix.cli }}
        run: |
          const { spawnSync } = require("node:child_process");
          const { version } = require("./package.json");
          const result = spawnSync(process.env.TORBEN_CLI, ["--version"], {
            encoding: "utf8",
            timeout: 10_000,
          });
          if (result.status !== 0 || result.stdout.trim() !== `torben ${version}`) {
            console.error(result.stderr || result.stdout || "CLI version check failed.");
            process.exit(1);
          }

      - name: Collect complete native package set
        run: >-
          node eng/collect-release-artifacts.mjs
          --bundle-root ${{ matrix.bundle }}
          --cli-binary ${{ matrix.cli }}
          --output artifacts/${{ matrix.target }}
          --target ${{ matrix.target }}

      - name: Archive Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $destination = "artifacts/${{ matrix.target }}/torben-$version-${{ matrix.target }}.zip"
          Compress-Archive -LiteralPath "${{ matrix.cli }}" -DestinationPath $destination

      - name: Archive Unix CLI with executable mode
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tar --create --gzip \
            --file "artifacts/${{ matrix.target }}/torben-$version-${{ matrix.target }}.tar.gz" \
            --directory target/release torben

      - name: Generate unsigned development metadata
        run: >-
          node eng/release-metadata.mjs create
          --artifacts artifacts/${{ matrix.target }}
          --target ${{ matrix.target }}
          --revision ${{ github.sha }}
          --source-ref ${{ github.ref }}
          --release-kind development
          --signing-status unsigned

      - name: Verify target artifact metadata
        run: >-
          node eng/release-metadata.mjs verify
          --artifacts artifacts/${{ matrix.target }}

      - name: Upload target development artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: artifacts/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  linux-package-acceptance:
    name: Install and launch Linux packages
    needs: build
    uses: ./.github/workflows/linux-package-acceptance.yml

  desktop-package-acceptance:
    name: Install and launch Windows and macOS packages
    needs: build
    uses: ./.github/workflows/desktop-package-acceptance.yml

  aggregate:
    name: Verify six-target release set
    needs: [build, desktop-package-acceptance, linux-package-acceptance]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x86_64-pc-windows-msvc
          path: artifacts/release-set/x86_64-pc-windows-msvc

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aarch64-pc-windows-msvc
          path: artifacts/release-set/aarch64-pc-windows-msvc

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x86_64-apple-darwin
          path: artifacts/release-set/x86_64-apple-darwin

      - name: Download macOS Apple Silicon artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aarch64-apple-darwin
          path: artifacts/release-set/aarch64-apple-darwin

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x86_64-unknown-linux-gnu
          path: artifacts/release-set/x86_64-unknown-linux-gnu

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aarch64-unknown-linux-gnu
          path: artifacts/release-set/aarch64-unknown-linux-gnu

      - name: Create aggregate release metadata
        run: >-
          node eng/verify-release-set.mjs create
          --releases artifacts/release-set

      - name: Re-verify downloaded release set
        run: >-
          node eng/verify-release-set.mjs verify
          --releases artifacts/release-set

      - name: Read workspace version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload verified six-target development release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: torben-app-${{ steps.version.outputs.version }}-development
          path: artifacts/release-set
          if-no-files-found: error
          retention-days: 14
