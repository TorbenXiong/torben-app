name: Windows and macOS package acceptance

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: Prefix used by the caller's per-target artifact names
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  install-and-launch:
    name: ${{ matrix.name }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 NSIS
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            format: nsis
          - name: Windows x64 MSI
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            format: msi
          - name: Windows ARM64 NSIS
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            format: nsis
          - name: Windows ARM64 MSI
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            format: msi
          - name: macOS Intel DMG
            runner: macos-15-intel
            target: x86_64-apple-darwin
            format: dmg
          - name: macOS Apple Silicon DMG
            runner: macos-15
            target: aarch64-apple-darwin
            format: dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Download exact desktop target artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}${{ matrix.target }}
          path: artifacts/${{ matrix.target }}

      - name: Install, inspect, and sustain Windows GUI launch
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TORBEN_ARTIFACT_ROOT: artifacts/${{ matrix.target }}
          TORBEN_PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          $ErrorActionPreference = 'Stop'
          node eng/release-metadata.mjs verify --artifacts $env:TORBEN_ARTIFACT_ROOT
          $extension = if ($env:TORBEN_PACKAGE_FORMAT -eq 'msi') { '*.msi' } else { '*-setup.exe' }
          $packages = @(Get-ChildItem -LiteralPath $env:TORBEN_ARTIFACT_ROOT -Filter $extension -File)
          if ($packages.Count -ne 1) { throw "Expected one $env:TORBEN_PACKAGE_FORMAT package, found $($packages.Count)." }
          $package = $packages[0].FullName
          $version = node -p "require('./package.json').version"
          $installRoot = $null
          try {
            if ($env:TORBEN_PACKAGE_FORMAT -eq 'msi') {
              $quotedPackage = '"' + $package + '"'
              $installer = Start-Process msiexec.exe `
                -ArgumentList @('/i', $quotedPackage, '/quiet', '/norestart') `
                -Wait -PassThru -WindowStyle Hidden
              if ($installer.ExitCode -notin @(0, 3010)) { throw "MSI installation failed with exit code $($installer.ExitCode)." }
            } else {
              $installer = Start-Process $package `
                -ArgumentList @('/S') `
                -Wait -PassThru -WindowStyle Hidden
              if ($installer.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($installer.ExitCode)." }
            }

            $registryPaths = @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
            )
            $records = @(
              foreach ($path in $registryPaths) {
                Get-ItemProperty -Path $path -ErrorAction SilentlyContinue |
                  Where-Object { $_.DisplayName -eq 'Torben App' -and $_.DisplayVersion -eq $version }
              }
            )
            $candidateRoots = @($records | ForEach-Object InstallLocation | Where-Object { $_ })
            $candidateRoots += @(
              (Join-Path $env:LOCALAPPDATA 'Torben App'),
              (Join-Path $env:LOCALAPPDATA 'Programs\Torben App'),
              (Join-Path $env:ProgramFiles 'Torben App')
            )
            if (${env:ProgramFiles(x86)}) { $candidateRoots += Join-Path ${env:ProgramFiles(x86)} 'Torben App' }
            $executables = @(
              $candidateRoots | Select-Object -Unique | Where-Object { Test-Path -LiteralPath $_ } |
                ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter torben-desktop.exe -File -Recurse }
            )
            if ($executables.Count -ne 1) { throw "Expected one installed torben-desktop.exe, found $($executables.Count)." }
            $installRoot = $executables[0].Directory.FullName
            node eng/desktop-package-smoke.mjs `
              --artifacts $env:TORBEN_ARTIFACT_ROOT `
              --format $env:TORBEN_PACKAGE_FORMAT `
              --installed-root $installRoot
            if ($LASTEXITCODE -ne 0) { throw "Windows package smoke test failed with exit code $LASTEXITCODE." }
          } finally {
            if ($env:TORBEN_PACKAGE_FORMAT -eq 'msi') {
              $quotedPackage = '"' + $package + '"'
              $uninstaller = Start-Process msiexec.exe `
                -ArgumentList @('/x', $quotedPackage, '/quiet', '/norestart') `
                -Wait -PassThru -WindowStyle Hidden
              if ($uninstaller.ExitCode -notin @(0, 1605, 3010)) { throw "MSI cleanup failed with exit code $($uninstaller.ExitCode)." }
            } elseif ($installRoot) {
              $uninstallers = @(Get-ChildItem -LiteralPath $installRoot -Filter uninstall.exe -File -Recurse)
              if ($uninstallers.Count -ne 1) { throw "Expected one NSIS uninstaller, found $($uninstallers.Count)." }
              $uninstaller = Start-Process $uninstallers[0].FullName `
                -ArgumentList @('/S') `
                -Wait -PassThru -WindowStyle Hidden
              if ($uninstaller.ExitCode -ne 0) { throw "NSIS cleanup failed with exit code $($uninstaller.ExitCode)." }
            }
          }

      - name: Copy, inspect, and sustain macOS GUI launch
        if: runner.os == 'macOS'
        shell: bash
        env:
          TORBEN_ARTIFACT_ROOT: artifacts/${{ matrix.target }}
          TORBEN_PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          node eng/release-metadata.mjs verify --artifacts "$TORBEN_ARTIFACT_ROOT"
          packages=()
          while IFS= read -r package; do packages+=("$package"); done < <(
            find "$TORBEN_ARTIFACT_ROOT" -maxdepth 1 -type f -name '*.dmg' -print
          )
          test "${#packages[@]}" -eq 1
          temporary_root="$(mktemp -d "$RUNNER_TEMP/torben-macos-acceptance.XXXXXX")"
          mount_root="$temporary_root/mount"
          installed_app="$temporary_root/Applications/Torben App.app"
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then hdiutil detach "$mount_root" -force || true; fi
            case "$temporary_root" in
              "$RUNNER_TEMP"/torben-macos-acceptance.*) rm -rf -- "$temporary_root" ;;
              *) echo "Refusing to remove unexpected acceptance directory: $temporary_root" >&2; return 1 ;;
            esac
          }
          trap cleanup EXIT
          mkdir -p "$mount_root" "$(dirname "$installed_app")"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_root" "${packages[0]}"
          mounted=true
          applications=()
          while IFS= read -r application; do applications+=("$application"); done < <(
            find "$mount_root" -maxdepth 2 -type d -name '*.app' -print
          )
          test "${#applications[@]}" -eq 1
          ditto "${applications[0]}" "$installed_app"
          hdiutil detach "$mount_root"
          mounted=false
          node eng/desktop-package-smoke.mjs \
            --artifacts "$TORBEN_ARTIFACT_ROOT" \
            --format "$TORBEN_PACKAGE_FORMAT" \
            --installed-root "$installed_app"
