name: Official signed portable release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: torben-official-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, and accept Windows x64 portable executable
    environment: official-release
    runs-on: windows-latest
    outputs:
      sha256: ${{ steps.portable.outputs.sha256 }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out exact tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Validate tag and release notes
        id: identity
        shell: node {0}
        run: |
          const { appendFileSync, existsSync, readFileSync } = require("node:fs");
          const { join } = require("node:path");
          const root = process.env.GITHUB_WORKSPACE;
          const { version } = JSON.parse(
            readFileSync(join(process.env.GITHUB_WORKSPACE, "package.json"), "utf8"),
          );
          if (process.env.GITHUB_REF !== `refs/tags/v${version}`) {
            throw new Error(`Expected refs/tags/v${version}; received ${process.env.GITHUB_REF}.`);
          }
          const notes = join(root, "docs", "releases", `${version}.md`);
          if (!existsSync(notes)) throw new Error(`Release notes are missing: ${notes}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component clippy,rustfmt --target x86_64-pc-windows-msvc

      - name: Select pinned Rust toolchain
        run: rustup default 1.98.0

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch locked Rust dependencies for the offline portable build
        run: cargo fetch --locked --target x86_64-pc-windows-msvc

      - name: Verify source and release tooling
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          pnpm run check
          pnpm run test

      - name: Prepare pinned Python Install Manager
        run: pnpm run prepare:python-manager

      - name: Import Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_SUBJECT: ${{ secrets.WINDOWS_CERTIFICATE_SUBJECT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('WINDOWS_CERTIFICATE', 'WINDOWS_CERTIFICATE_PASSWORD', 'WINDOWS_CERTIFICATE_SUBJECT', 'WINDOWS_TIMESTAMP_URL')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { throw "Official release secret is missing: $name" }
          }
          if (-not $env:WINDOWS_TIMESTAMP_URL.StartsWith('https://')) { throw 'Windows timestamp URL must use HTTPS.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'torben-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -LiteralPath $certificatePath
          if (-not $certificate.HasPrivateKey) { throw 'Windows certificate has no private key.' }
          if ($certificate.Subject -ne $env:WINDOWS_CERTIFICATE_SUBJECT) { throw "Windows certificate subject mismatch: $($certificate.Subject)" }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build embedded native components
        run: node eng/build-windows-portable.mjs --prepare-only

      - name: Sign embedded native components
        shell: pwsh
        env:
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK.' }
          $names = @(
            'torben-plugin-node',
            'torben-plugin-temurin',
            'torben-plugin-python',
            'torben-plugin-rust',
            'torben-plugin-mysql',
            'torben-plugin-redis',
            'torben-plugin-postgresql',
            'torben-shim'
          )
          foreach ($name in $names) {
            $file = Join-Path 'target\release' "$name.exe"
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Embedded component is missing: $file" }
            & $signtool sign /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT /fd sha256 /tr $env:WINDOWS_TIMESTAMP_URL /td sha256 $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $file" }
          }

      - name: Build portable desktop executable
        working-directory: apps/desktop
        run: node ../../eng/build-windows-portable.mjs --desktop-only

      - name: Sign and verify portable executable
        id: portable
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_SUBJECT: ${{ secrets.WINDOWS_CERTIFICATE_SUBJECT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK.' }
          $portable = 'artifacts\torben-app-portable-windows-x64\TorbenApp.exe'
          & $signtool sign /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT /fd sha256 /tr $env:WINDOWS_TIMESTAMP_URL /td sha256 $portable
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $portable" }
          $signatureTargets = @($portable)
          $signatureTargets += @(
            'torben-plugin-node',
            'torben-plugin-temurin',
            'torben-plugin-python',
            'torben-plugin-rust',
            'torben-plugin-mysql',
            'torben-plugin-redis',
            'torben-plugin-postgresql',
            'torben-shim'
          ) | ForEach-Object { if ($_ -eq $portable) { $_ } else { "target\release\$_.exe" } }
          foreach ($file in $signatureTargets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $file ($($signature.Status))" }
            if ($signature.SignerCertificate.Subject -ne $env:WINDOWS_CERTIFICATE_SUBJECT) { throw "Unexpected Authenticode publisher: $file" }
            if (-not $signature.TimeStamperCertificate) { throw "Authenticode timestamp is missing: $file" }
          }
          $version = (Get-Item -LiteralPath $portable).VersionInfo.ProductVersion
          if ($version -ne '${{ steps.identity.outputs.version }}') { throw "Portable version mismatch: $version" }
          node eng/verify-windows-portable-release.mjs --directory artifacts/torben-app-portable-windows-x64
          $sha256 = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Launch portable executable with isolated data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Resolve-Path 'artifacts\torben-app-portable-windows-x64\TorbenApp.exe'
          $root = Join-Path $env:RUNNER_TEMP "torben-portable-acceptance-$([Guid]::NewGuid())"
          $data = Join-Path $root 'userData'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $portable = Join-Path $root 'TorbenApp.exe'
          Copy-Item -LiteralPath $source -Destination $portable
          $process = $null
          try {
            $process = Start-Process -FilePath $portable -WorkingDirectory $root -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds 10
            if ($process.HasExited) { throw "TorbenApp.exe exited during portable acceptance with code $($process.ExitCode)." }
            if (-not (Test-Path -LiteralPath (Join-Path $data 'state.db') -PathType Leaf)) { throw 'Portable launch did not initialize state.db.' }
            if (Test-Path -LiteralPath (Join-Path $data 'tools\shims\userData')) { throw 'Portable launch created a recursively nested shim data directory.' }
          } finally {
            $cleanupError = $null
            if ($process -and -not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
              if ($LASTEXITCODE -ne 0) { $cleanupError = "Could not stop the portable process tree (exit code $LASTEXITCODE)." }
            }
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            if ($cleanupError) { throw $cleanupError }
          }

      - name: Upload signed portable executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-windows-x64-portable
          path: artifacts/torben-app-portable-windows-x64/TorbenApp.exe
          if-no-files-found: error
          retention-days: 30

      - name: Remove imported Windows certificate
        if: always() && env.WINDOWS_CERTIFICATE_THUMBPRINT != ''
        shell: pwsh
        run: Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT"

  publish:
    name: Verify and publish signed portable release
    needs: build
    environment: official-release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_CERTIFICATE_SUBJECT: ${{ secrets.WINDOWS_CERTIFICATE_SUBJECT }}
    steps:
      - name: Check out exact tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Download signed portable executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: official-windows-x64-portable
          path: artifacts/publishing

      - name: Re-verify downloaded portable executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node eng/verify-windows-portable-release.mjs --directory artifacts/publishing --expected-sha256 '${{ needs.build.outputs.sha256 }}'
          $portable = 'artifacts\publishing\TorbenApp.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $portable
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -ne $env:WINDOWS_CERTIFICATE_SUBJECT) { throw 'Unexpected Authenticode publisher.' }
          if (-not $signature.TimeStamperCertificate) { throw 'Authenticode timestamp is missing.' }
          $version = (Get-Item -LiteralPath $portable).VersionInfo.ProductVersion
          if ($version -ne '${{ needs.build.outputs.version }}') { throw "Portable version mismatch: $version" }

      - name: Create release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.build.outputs.version }}'
          $template = "docs\releases\$version.md"
          $notes = Get-Content -LiteralPath $template -Raw
          $notes += "`n`n## 下载`n`n下载 ``TorbenApp.exe`` 后直接运行。"
          $notes += "`n`n## SHA-256`n`n``${{ needs.build.outputs.sha256 }}``"
          $notes += "`n`n## 变更日志`n`n完整变更记录：[查看 $version 提交记录](https://github.com/${{ github.repository }}/commits/v$version)"
          Set-Content -LiteralPath 'artifacts\release-notes.md' -Value $notes -Encoding utf8NoBOM

      - name: Create immutable GitHub Release
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" 'artifacts\publishing\TorbenApp.exe' `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --title '${{ needs.build.outputs.version }}' `
            --notes-file 'artifacts\release-notes.md'
