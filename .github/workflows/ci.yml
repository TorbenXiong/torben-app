name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Select Rust toolchain
        run: rustup default 1.98.0
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Rust CLI lifecycle fixture lint
        run: >-
          cargo clippy --locked
          -p torben-cli
          --all-targets
          --features test-fixtures
          -- -D warnings
      - name: Build real CLI lifecycle sidecars
        run: >-
          cargo build --locked
          -p torben-shim
          -p torben-cli
          --features torben-cli/test-fixtures
      - name: Real CLI Node.js lifecycle
        run: >-
          cargo test --locked
          -p torben-cli
          --features test-fixtures
          --test node_lifecycle
      - name: Rust desktop lifecycle fixture lint
        run: >-
          cargo clippy --locked
          -p torben-desktop
          --all-targets
          --features test-fixtures
          -- -D warnings
      - name: Desktop command Node.js lifecycle
        run: >-
          cargo test --locked
          -p torben-desktop
          --features test-fixtures
          desktop_commands_complete_the_managed_node_lifecycle
      - name: Prepare bundled native tools
        run: pnpm --filter @torben-app/desktop run prepare:bundled-tools
      - name: Frontend checks
        run: pnpm run check
      - name: Frontend tests
        run: pnpm run test

  live-official-catalogs:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Verify all official provider catalogs
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Select Rust toolchain
        run: rustup default 1.98.0
      - name: Build CLI and all official provider plugins
        run: >-
          cargo build --locked
          -p torben-cli
          -p torben-plugin-node
          -p torben-plugin-temurin
          -p torben-plugin-python
          -p torben-plugin-git
          -p torben-plugin-vscode
          -p torben-plugin-codex
      - name: Prepare isolated local state
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "torben-live"
          @("home", "data", "config", "cache", "temp") | ForEach-Object {
            New-Item -ItemType Directory -Force -Path (Join-Path $root $_) | Out-Null
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
      - name: Verify all official catalogs through Torben
        run: >-
          node eng/check-live-catalogs.mjs
          --cli target/debug/torben.exe
          --output artifacts/live-catalogs
        env:
          USERPROFILE: ${{ runner.temp }}\torben-live\home
          LOCALAPPDATA: ${{ runner.temp }}\torben-live\data
          APPDATA: ${{ runner.temp }}\torben-live\config
          TEMP: ${{ runner.temp }}\torben-live\temp
          TMP: ${{ runner.temp }}\torben-live\temp
      - name: Upload validated catalog snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-official-catalogs
          path: artifacts/live-catalogs
          retention-days: 14
